<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>AlphaMaster 控制台</title>
<style>
:root{
  --bg:#0d1117; --panel:#161b22; --panel2:#1c2230; --line:#252d3a;
  --text:#e6edf3; --dim:#8b949e; --dim2:#6b7684;
  --up:#f85149;      /* 中国习惯：涨=红 */
  --down:#3fb950;    /* 跌=绿 */
  --accent:#58a6ff; --warn:#d29922; --ok:#3fb950; --bad:#f85149;
  --mono:"JetBrains Mono","Cascadia Mono",Consolas,"Courier New",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--bg);color:var(--text);
  font:13px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;
  display:flex;flex-direction:column;overflow:hidden;
}
button{font:inherit;cursor:pointer}
.btn{
  background:var(--panel2);color:var(--text);border:1px solid var(--line);
  border-radius:6px;padding:5px 12px;transition:.15s;
}
.btn:hover{border-color:var(--accent);color:#fff}
.btn.primary{background:#1f6feb;border-color:#1f6feb;color:#fff}
.btn.primary:hover{background:#388bfd}
.btn.danger{background:#3d1518;border-color:#6e2226;color:#ff9d97}
.btn.danger:hover{background:#5a1c20;border-color:#f85149}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:3px 9px;font-size:12px}

/* ── 顶栏 ── */
.top{
  display:flex;align-items:center;gap:14px;padding:9px 16px;
  background:var(--panel);border-bottom:1px solid var(--line);flex:0 0 auto;
}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;letter-spacing:.3px}
.brand .led{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok)}
.brand .led.off{background:var(--dim2);box-shadow:none}
.kpis{display:flex;gap:0;margin-left:6px}
.kpi{display:flex;flex-direction:column;line-height:1.25;padding:0 16px}
.kpi + .kpi{border-left:1px solid var(--line)}
.kpi:first-child{padding-left:6px}
.kpi .k{font-size:10.5px;color:var(--dim);letter-spacing:.4px}
.kpi .v{font-family:var(--mono);font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
.spacer{flex:1}
.clock{font-family:var(--mono);color:var(--dim);font-size:12px}

/* ── 页签 ── */
.tabs{display:flex;gap:2px;padding:0 12px;background:var(--panel);border-bottom:1px solid var(--line);flex:0 0 auto}
.tab{
  padding:8px 16px;color:var(--dim);border:none;background:transparent;
  border-bottom:2px solid transparent;font-size:12.5px;
}
.tab:hover{color:var(--text)}
.tab.on{color:#fff;border-bottom-color:var(--accent)}

main{flex:1;overflow:auto;padding:14px 16px 24px}
section{display:none}
section.on{display:block}

h3{margin:0 0 10px;font-size:12px;color:var(--dim);font-weight:600;letter-spacing:.6px;text-transform:uppercase}
.hint{color:var(--dim2);font-size:11.5px}

/* ── 服务卡 ── */
.svcs{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px;margin-bottom:20px}
.svc{
  background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 13px;
  display:flex;flex-direction:column;gap:9px;
}
.svc .hd{display:flex;align-items:center;gap:8px}
.svc .nm{font-weight:600}
.svc .st{margin-left:auto;font-size:11px;padding:2px 8px;border-radius:20px;border:1px solid var(--line);color:var(--dim)}
.st.run{color:#7ee787;border-color:#2ea04340;background:#12261a}
.st.stop{color:var(--dim)}
.st.bad{color:#ff9d97;border-color:#6e2226;background:#2a1214}
.svc .ds{color:var(--dim);font-size:11.5px;font-family:var(--mono)}
.svc .ft{display:flex;align-items:center;gap:8px}
.svc .ft .meta{color:var(--dim2);font-size:11px;font-family:var(--mono)}

/* ── 品种卡 ── */
.syms{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:10px}
.sym{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 13px}
.sym .hd{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.sym .cd{font-weight:700;letter-spacing:.4px}
.rows{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:12px}
.rows .k{color:var(--dim)}
.rows .v{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.up{color:var(--up)} .down{color:var(--down)} .dimv{color:var(--dim)}

/* ── 训练 / 表单 ── */
.grid2{display:grid;grid-template-columns:minmax(360px,520px) 1fr;gap:14px;align-items:start}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label{font-size:11.5px;color:var(--dim)}
input[type=text],input[type=number],select{
  background:#0b0f16;border:1px solid var(--line);color:var(--text);
  border-radius:6px;padding:7px 9px;font:12.5px var(--mono);outline:none;width:100%;
}
input:focus,select:focus{border-color:var(--accent)}
.row{display:flex;gap:10px}
.row>*{flex:1}
.chk{display:flex;align-items:center;gap:7px;color:var(--dim);font-size:12px;cursor:pointer}
.chk input{width:14px;height:14px;accent-color:var(--accent)}
.bar{height:6px;background:#0b0f16;border-radius:20px;overflow:hidden;margin:8px 0 4px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,#1f6feb,#58a6ff);width:0;transition:.4s}

/* ── 日志 ── */
pre.log{
  background:#080b10;border:1px solid var(--line);border-radius:8px;
  margin:0;padding:10px 12px;font:11.5px/1.55 var(--mono);color:#c9d1d9;
  overflow:auto;white-space:pre-wrap;word-break:break-all;
}
pre.log.tall{height:calc(100vh - 260px)}
pre.log.mid{height:300px}
pre.log.short{height:210px}

/* ── 训练曲线 ── */
.curve-head{display:flex;align-items:center;gap:14px;margin:10px 0 6px;font-size:11.5px;color:var(--dim)}
.curve-legend{display:flex;align-items:center;gap:5px}
.curve-legend .sw{width:9px;height:9px;border-radius:2px;display:inline-block;flex:0 0 auto}
.curve-legend .sw.best{background:#34f5c8}
.curve-legend .sw.val{background:#58a6ff}
.curve-box{position:relative;background:#080b10;border:1px solid var(--line);border-radius:8px;height:172px;overflow:hidden}
.curve-box canvas{display:block;width:100%;height:100%}
.curve-empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  color:var(--dim2);font-size:12px;text-align:center;padding:0 20px;line-height:1.6}
.curve-tip{position:absolute;pointer-events:none;background:#22272e;border:1px solid var(--line);
  border-radius:6px;padding:4px 8px;font:11px/1.5 var(--mono);color:var(--text);white-space:nowrap;
  opacity:0;transition:opacity .12s;z-index:2}
.formula{display:flex;gap:8px;align-items:baseline;margin:8px 0 10px;font-size:11.5px;min-height:17px}
.formula .lb{color:var(--dim);flex:0 0 auto}
.formula code{font-family:var(--mono);font-size:11px;color:#c9d1d9;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;flex:1;cursor:default}
.formula code.dim{color:var(--dim2)}

.empty{color:var(--dim2);font-size:12px;padding:10px 2px}
.errbox{
  background:#2a1214;border:1px solid #6e2226;border-left:3px solid var(--bad);
  border-radius:6px;padding:8px 10px;color:#ff9d97;font-size:12px;line-height:1.5;
  white-space:pre-wrap;word-break:break-word;margin-bottom:8px;
}
.errbox .t{font-weight:600;margin-bottom:2px;color:#ffb3ad}
.plan{color:var(--dim2);font-size:11.5px;margin:-4px 0 12px;font-family:var(--mono)}
.plan b{color:var(--text)}
.plan .bad{color:var(--bad)}
.plan .warn{color:var(--warn);margin-top:5px;line-height:1.6;font-family:inherit}
.toast{
  position:fixed;right:18px;bottom:18px;background:#22272e;border:1px solid var(--line);
  border-left:3px solid var(--accent);border-radius:8px;padding:9px 14px;font-size:12.5px;
  box-shadow:0 8px 24px #0008;opacity:0;transform:translateY(8px);transition:.25s;pointer-events:none;
  max-width:420px;
}
.toast.on{opacity:1;transform:none}
.toast.err{border-left-color:var(--bad)}
</style>
</head>
<body>

<header class="top">
  <div class="brand"><span class="led" id="led"></span>AlphaMaster 控制台</div>
  <div class="kpis" id="kpis"></div>
  <div class="spacer"></div>
  <div class="clock" id="clock">–</div>
  <button class="btn danger" onclick="quitAll()">停止全部并退出</button>
</header>

<nav class="tabs">
  <button class="tab on" data-tab="overview">总览</button>
  <button class="tab" data-tab="train">训练</button>
  <button class="tab" data-tab="live">实盘</button>
  <button class="tab" data-tab="log">日志</button>
</nav>

<main>
  <!-- 总览 -->
  <section id="tab-overview" class="on">
    <h3>服务</h3>
    <div class="svcs" id="svcs"></div>
    <h3>品种</h3>
    <div class="syms" id="syms"></div>
  </section>

  <!-- 训练 -->
  <section id="tab-train">
    <div class="grid2">
      <div class="card">
        <h3>新建训练</h3>
        <div class="field">
          <label>数据文件</label>
          <select id="dataFile"></select>
        </div>
        <div class="row">
          <div class="field">
            <label>本次追加步数</label>
            <input type="number" id="steps" placeholder="2000" min="1" step="100">
          </div>
          <div class="field">
            <label>单边成本率</label>
            <input type="number" id="cost" placeholder="0.0005" step="0.0001" min="0">
          </div>
        </div>
        <div class="plan" id="planHint">–</div>
        <label class="chk" style="margin-bottom:14px">
          <input type="checkbox" id="fromScratch"> 从零开始（丢弃已有检查点）
        </label>
        <div style="display:flex;gap:10px">
          <button class="btn primary" id="btnTrain" onclick="startTrain()">开始训练</button>
          <button class="btn" id="btnTrainStop" onclick="stopTrain()" disabled>停止训练</button>
        </div>
        <div class="hint" style="margin-top:12px">
          训练在独立进程中运行，关闭本窗口会被一起停止。<br>
          步数是「在现有检查点之上再练多少」，不是总目标，所以每次点击都会真的开始训练。
        </div>
      </div>

      <div class="card">
        <h3>当前任务</h3>
        <div id="trainNow" class="empty">没有正在运行的训练</div>
        <div class="bar"><i id="trainBar"></i></div>
        <div class="curve-head">
          <span class="curve-legend"><i class="sw best"></i>最优分数</span>
          <span class="curve-legend"><i class="sw val"></i>验证分数</span>
          <span style="flex:1"></span>
          <span class="hint" id="curveMeta">–</span>
        </div>
        <div class="curve-box" id="curveBox">
          <canvas id="curve"></canvas>
          <div class="curve-empty" id="curveEmpty">还没有训练记录</div>
          <div class="curve-tip" id="curveTip"></div>
        </div>
        <div class="formula">
          <span class="lb">最优公式</span><code id="formulaText" class="dim">–</code>
        </div>
        <pre class="log short" id="trainLog">等待训练…</pre>
      </div>
    </div>
  </section>

  <!-- 实盘 -->
  <section id="tab-live">
    <div class="grid2">
      <div class="card">
        <h3>实盘循环</h3>
        <div id="liveList"></div>
        <div class="hint" style="margin-top:12px">
          启动后每根 bar 收盘触发一次；停止走 Ctrl+C，让执行器自己写停止心跳。
        </div>
      </div>
      <div class="card">
        <h3>执行器日志</h3>
        <pre class="log mid" id="liveLog">–</pre>
      </div>
    </div>
  </section>

  <!-- 日志 -->
  <section id="tab-log">
    <div style="display:flex;gap:10px;align-items:center;margin-bottom:10px">
      <select id="logKey" style="max-width:260px"></select>
      <button class="btn sm" onclick="loadLog(true)">刷新</button>
      <label class="chk"><input type="checkbox" id="autoScroll" checked> 自动滚到底</label>
      <span class="hint" id="logMeta"></span>
    </div>
    <pre class="log tall" id="logBox">–</pre>
  </section>
</main>

<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const H = {'X-Cockpit':'1','Content-Type':'application/json'};
let STATE = null, TAB = 'overview', busy = {};

function toast(msg, err, ms){
  const t = $('#toast'); t.textContent = msg; t.className = 'toast on' + (err?' err':'');
  clearTimeout(t._t);
  t._t = setTimeout(()=>t.className='toast', ms || (err ? 9000 : 2600));
}
function fmt(v,d=2){
  if(v===null||v===undefined||Number.isNaN(v)) return '–';
  return Number(v).toLocaleString('zh-CN',{minimumFractionDigits:d,maximumFractionDigits:d});
}
function pct(v,d=2){ return (v===null||v===undefined||Number.isNaN(v))?'–':(v*100).toFixed(d)+'%'; }
function ago(s){
  if(s===null||s===undefined) return '–';
  s = Math.max(0, Math.round(s));
  if(s<60) return s+' 秒前';
  if(s<3600) return Math.round(s/60)+' 分钟前';
  if(s<86400) return (s/3600).toFixed(1)+' 小时前';
  return Math.round(s/86400)+' 天前';
}
function dur(s){
  s=Math.max(0,s|0);
  const h=Math.floor(s/3600), m=Math.floor(s%3600/60), x=s%60;
  if(h) return `${h}h${String(m).padStart(2,'0')}m`;
  if(m) return `${m}m${String(x).padStart(2,'0')}s`;
  return x+'s';
}
function agoShort(s){
  if(s==null) return '–';
  if(s < 60) return Math.round(s)+' 秒前';
  if(s < 3600) return Math.round(s/60)+' 分钟前';
  if(s < 86400) return (s/3600).toFixed(1)+' 小时前';
  return Math.round(s/86400)+' 天前';
}
function esc(s){ return String(s??'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

async function api(path, body){
  const opt = body===undefined ? {} : {method:'POST', headers:H, body:JSON.stringify(body)};
  const r = await fetch(path, opt);
  let j = {};
  try{ j = await r.json(); }catch(e){}
  if(!r.ok) throw new Error(j.error || ('HTTP '+r.status));
  return j;
}

/* ── 页签 ── */
document.querySelectorAll('.tab').forEach(b=>{
  b.onclick = ()=>{
    TAB = b.dataset.tab;
    document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on', x===b));
    document.querySelectorAll('section').forEach(s=>s.classList.toggle('on', s.id==='tab-'+TAB));
    if(TAB==='log') loadLog(true);
    if(TAB==='train'){ loadTrainLog(); setTimeout(drawCurve, 20); }  // 隐藏时量不到宽高
    if(TAB==='live') loadLiveLog();
  };
});

/* ── 状态刷新 ── */
async function refresh(){
  try{
    STATE = await api('/api/state');
    renderTop(); renderServices(); renderSymbols(); renderTrain(); renderLive();
    $('#led').className = 'led';
    $('#clock').textContent = STATE.now;
  }catch(e){
    $('#led').className = 'led off';
    $('#clock').textContent = '连接断开';
  }
}

function renderTop(){
  const sv = STATE.services || [];
  const running = sv.filter(s=>s.running).length;
  const pos = (STATE.symbols||[]).filter(s=>s.position && Math.abs(s.position.volume||0)>1e-9).length;
  const tj = STATE.train_job || {};
  const trainTxt = tj.running ? ('第 '+(tj.step??'?')+' 步')
                 : tj.external ? ('外部 '+(tj.step??'?')+' 步') : '空闲';
  const trainColor = tj.running ? 'var(--accent)' : tj.external ? 'var(--warn)' : 'var(--dim)';
  $('#kpis').innerHTML = `
    <div class="kpi"><span class="k">服务</span><span class="v">${running}/${sv.length}</span></div>
    <div class="kpi"><span class="k">持仓</span><span class="v">${pos}</span></div>
    <div class="kpi"><span class="k">训练</span><span class="v" style="color:${trainColor}">${trainTxt}</span></div>
    <div class="kpi"><span class="k">进程托管</span><span class="v" style="color:${STATE.app.job_object?'var(--ok)':'var(--warn)'}">${STATE.app.job_object?'已启用':'降级'}</span></div>`;
}

function renderServices(){
  const box = $('#svcs'); const sv = STATE.services || [];
  box.innerHTML = sv.map(s=>{
    const cls = s.running ? (s.healthy===false && s.port ? 'st bad' : 'st run') : 'st stop';
    const txt = s.running ? (s.healthy===false && s.port ? '启动中' : '运行中') : '已停止';
    const meta = s.running
      ? (s.port ? `127.0.0.1:${s.port} · ` : '') + dur(s.uptime_sec)
      : (s.last_exit!==null && s.last_exit!==undefined ? `上次退出码 ${s.last_exit}` : '未启动');
    return `<div class="svc">
      <div class="hd"><span class="nm">${esc(s.title)}</span><span class="${cls}">${txt}</span></div>
      <div class="ds">${esc(s.desc)}</div>
      <div class="ft">
        <span class="meta">${meta}</span>
        <span style="flex:1"></span>
        ${s.running
          ? `<button class="btn sm" onclick="svcStop('${s.key}')">停止</button>`
          : `<button class="btn sm primary" onclick="svcStart('${s.key}', false)">启动</button>`}
      </div>
    </div>`;
  }).join('');
}

function renderSymbols(){
  const box = $('#syms'); const list = STATE.symbols || [];
  if(!list.length){ box.innerHTML = '<div class="empty">没有发现品种。检查 factor-governor 路径是否正确。</div>'; return; }
  box.innerHTML = list.map(s=>{
    const acct = s.account || {}, acc = acct.account || {}, pos = s.position || {};
    const mdl = s.model || {}, sig = s.signal || {}, tr = s.training || {};
    const rows = [];
    if(acct.ok && acc.equity!=null){
      const pnl = (acc.equity||0)-(acc.balance||0);
      const cls = Math.abs(pnl)<0.005 ? 'dimv' : (pnl>0?'up':'down');
      rows.push(['权益', `<span class="${cls}">${fmt(acc.equity)}</span>`]);
    }else{
      rows.push(['账户', `<span style="color:var(--warn)">未连接</span>`]);
    }
    if(pos && pos.volume){
      rows.push(['持仓', `${pos.side||''} ${fmt(pos.volume,4)} @ ${fmt(pos.avg_price,4)}`]);
    }else{
      rows.push(['持仓', '<span class="dimv">空仓</span>']);
    }
    if(mdl.version) rows.push(['模型', `<span class="dimv">${esc(String(mdl.version).replace(/^v/,''))}</span>`]);
    if(sig.direction) rows.push(['信号', `${esc(sig.direction)} <span class="dimv">${fmt(sig.composite,3)}</span>`]);
    if(tr.running) rows.push(['训练', `<span style="color:var(--accent)">第 ${tr.step??tr.ckpt_step??'?'} 步</span>`]);
    const st = s.state || 'unknown';
    const stmap = {running:['运行中','st run'],waiting:['等待','st run'],dead:['已停止','st stop'],stalled:['心跳停滞','st bad'],idle:['待机','st stop'],training:['训练中','st run'],unknown:['未知','st stop']};
    const [stt, stc] = stmap[st] || ['未知','st stop'];
    return `<div class="sym">
      <div class="hd"><span class="cd">${esc(s.symbol)}</span>
        <span class="${stc}">${stt}</span>
        <span style="margin-left:auto" class="hint">${s.heartbeat?ago(s.heartbeat.beat_age):''}</span></div>
      <div class="rows">${rows.map(([k,v])=>`<span class="k">${k}</span><span class="v">${v}</span>`).join('')}</div>
    </div>`;
  }).join('');
}

/* ── 服务操作 ── */
async function svcStart(key, dry){
  try{ const r = await api('/api/service/start',{key, dry_run:!!dry}); toast(r.already?'已在运行':'已启动 '+key); }
  catch(e){ toast('启动失败：'+e.message, true); }
  refresh();
}
async function svcStop(key){
  try{ const r = await api('/api/service/stop',{key}); toast('已停止（'+(r.how||'ok')+'）'); }
  catch(e){ toast('停止失败：'+e.message, true); }
  refresh();
}
async function quitAll(){
  if(!confirm('停止全部服务并退出控制台？\n实盘循环会被优雅停止。')) return;
  try{ await api('/api/quit',{}); }catch(e){}
  document.body.innerHTML = '<div style="padding:40px;color:#8b949e">正在停止所有服务…</div>';
}

/* ── 训练 ── */
let STARTING = false, PLAN = null, PLAN_KEY = '', DATAINFO = {}, DATAINFO_PENDING = {}, PLAN_SEQ = 0;

function selectedAddSteps(){
  const v = parseInt($('#steps').value, 10);
  return (Number.isFinite(v) && v > 0) ? v : 2000;
}

/* 数据文件体检：真读一遍 parquet 拿 K 线根数。缓存按文件路径存，
   同一个文件切换回来不用再等一次子进程；同一文件的并发请求合并成一次。 */
async function ensureDataInfo(df){
  if(!df) return null;
  if(DATAINFO[df]) return DATAINFO[df];
  if(DATAINFO_PENDING[df]) return DATAINFO_PENDING[df];
  const task = (async () => {
    try{
      return await api('/api/train/inspect?data_file=' + encodeURIComponent(df));
    }catch(e){
      return {ok:false, blocking:false, error:'无法读取数据文件：' + e.message};
    }
  })();
  DATAINFO_PENDING[df] = task;
  const info = await task;
  delete DATAINFO_PENDING[df];
  DATAINFO[df] = info;
  return info;
}

/* 算出「从第几步练到第几步」。不这样的话，用户在检查点 3200 时填 2000，
   AlphaMaster 会认为已经练完，打印「跳过训练」直接退出。 */
async function loadPlan(){
  const df = $('#dataFile').value;
  const seq = ++PLAN_SEQ;      // 连续切品种时，只认最后一次选择
  if(!df){ $('#planHint').textContent = '没有可用数据文件'; PLAN = null; return; }
  if(!DATAINFO[df]) $('#planHint').textContent = '正在读取数据文件…';
  const info = await ensureDataInfo(df);
  if(seq !== PLAN_SEQ) return;
  if(info && info.ok === false && info.blocking){
    $('#planHint').innerHTML = `<span class="bad">${esc(info.error)}</span>`;
    PLAN = null; PLAN_KEY = '';
    return;
  }
  const fs = $('#fromScratch').checked ? 1 : 0;
  const key = df + '|' + selectedAddSteps() + '|' + fs;
  if(key === PLAN_KEY && PLAN) return;
  try{
    const p = await api('/api/train/plan?data_file=' + encodeURIComponent(df)
      + '&add=' + selectedAddSteps() + '&fs=' + fs);
    if(seq !== PLAN_SEQ) return;
    PLAN = p; PLAN_KEY = key;
    if(p.exists === false){ $('#planHint').textContent = '数据文件不存在'; return; }
    const from = fs ? 0 : p.start_step;
    let tail;
    if(fs) tail = '（从零开始，会丢弃已有检查点）';
    else if(p.start_step > 0) tail = `（已有检查点 ${p.start_step} 步）`;
    else tail = '（没有检查点，从头练）';
    const bars = (info && info.ok)
      ? `数据 ${info.bars} 根 K 线${info.years ? `（约 ${info.years} 年）` : ''} · ` : '';
    $('#planHint').innerHTML = bars ? `${esc(bars)}预计：第 <b>${from}</b> → <b>${p.total_steps}</b> 步${esc(tail)}` : `预计：第 <b>${from}</b> → <b>${p.total_steps}</b> 步${esc(tail)}`;
    if(info && info.ok && info.thin){
      $('#planHint').innerHTML += `<div class="warn">K 线只有 ${info.bars} 根，滚动验证每折样本很少，分数不太可信，建议补到 2000 根以上。</div>`;
    }
    if(p.prior_timeframe && p.timeframe && p.prior_timeframe !== p.timeframe){
      $('#planHint').innerHTML += `<div class="warn">这个品种上次是用 ${esc(p.prior_timeframe)} 练的，这次是 ${esc(p.timeframe)}。检查点和策略文件按品种共用，续训会接着旧周期的权重，练出的公式也可能盖掉旧周期的线上版本。</div>`;
    }
  }catch(e){
    $('#planHint').textContent = '无法计算步数范围：' + e.message;
  }
}

/* ── 训练曲线与最优公式 ── */
let CURVE_DATA = null, SERIES_PENDING = {}, SERIES_AT = {};
let FORMULA = {}, FORMULA_KEY = '', FORMULA_AT = 0, FORMULA_PENDING = {};
let SPEED = {step:null, t:0, value:null};
let SEL_MANUAL = false;   // 用户是否手动选过数据文件
let VIZ_SYM = '';         // 界面当前展示的是哪个品种（曲线说了算）

/* 当前该看哪个品种的曲线：
   1. 本窗口正在跑的训练 —— 强制跟随，不能一边练一边看别的
   2. 用户手动选的数据文件 —— 他想看谁就看谁
   3. 别处跑着的训练
   4. 都没指定 → 交给后端挑最近写入的那份，避免一进来就盯着几小时前的旧曲线 */
function currentSymbol(tj){
  if(tj && tj.running && tj.symbol) return String(tj.symbol).toUpperCase();
  if(SEL_MANUAL){
    const df = $('#dataFile').value || '';
    const m = df.split(/[\\/]/).pop().match(/^(.+?)_(?:M\d+|H\d+|D\d+)\.parquet$/i);
    if(m) return m[1].toUpperCase();
  }
  if(tj && tj.symbol) return String(tj.symbol).toUpperCase();
  return '';
}

async function loadSeries(sym){
  const key = sym || '__latest__';
  if(SERIES_PENDING[key]) return;
  SERIES_PENDING[key] = true;
  try{
    const d = await api('/api/train/series?symbol=' + encodeURIComponent(sym || ''));
    SERIES_AT[key] = Date.now();
    if(currentSymbol((STATE && STATE.train_job) || {}) !== sym) return;  // 已经切走了
    CURVE_DATA = d;
    if(d.ok && d.symbol) VIZ_SYM = String(d.symbol).toUpperCase();
    drawCurve();
    const meta = $('#curveMeta');
    if(!d.ok) meta.textContent = d.error || '–';
    else if(d.updated_sec != null && d.updated_sec < 30) meta.textContent = `${d.symbol} · ${d.points} 点 · 正在写`;
    else meta.textContent = `${d.symbol} · ${d.points} 点 · 上次写入 ${agoShort(d.updated_sec)}`;
    renderTrainNow((STATE && STATE.train_job) || {});   // 最优分数可能只有历史文件里才有
    // 没指定品种（自动挑的最近一份）时，公式也按挑中的品种取
    if(d.ok && d.symbol && !sym) loadFormula(VIZ_SYM);
  }catch(e){
  }finally{
    delete SERIES_PENDING[key];
  }
}

/* 公式要从检查点里读，torch 不在控制台进程里，一次 2~4 秒，按品种缓存；
   检查点二十来步才写一次，所以 40 秒内不重复问。 */
async function loadFormula(sym){
  if(!sym || FORMULA_PENDING[sym]) return;
  const fresh = FORMULA[sym] && FORMULA_KEY === sym && (Date.now() - FORMULA_AT) < 40000;
  if(fresh) return;
  FORMULA_PENDING[sym] = true;
  if(!(FORMULA[sym] && FORMULA[sym].ok)){
    const el = $('#formulaText');
    el.classList.add('dim'); el.textContent = '读取中…'; el.title = '';
  }
  try{
    const r = await api('/api/train/formula?symbol=' + encodeURIComponent(sym));
    FORMULA[sym] = r; FORMULA_KEY = sym; FORMULA_AT = Date.now();
    if(!VIZ_SYM || VIZ_SYM === sym) paintFormula(r);
  }catch(e){
    if(!VIZ_SYM || VIZ_SYM === sym){
      const el = $('#formulaText'); el.classList.add('dim');
      el.textContent = '读取失败：' + e.message; el.title = '';
    }
  }finally{
    delete FORMULA_PENDING[sym];
  }
}

function paintFormula(r){
  const el = $('#formulaText');
  if(r && r.ok && r.decoded){
    el.classList.remove('dim');
    el.textContent = r.decoded;
    el.title = `${r.decoded}\n来源 ${r.source === 'ckpt' ? '检查点' : '策略文件'}`
      + ` · 第 ${r.step ?? '?'} 步 · 分数 ${fmt(r.score,4)}`;
  }else{
    el.classList.add('dim');
    el.textContent = (r && r.error) || '–';
    el.title = '';
  }
}

function syncTrainViz(tj){
  const sym = currentSymbol(tj);
  if(sym){
    VIZ_SYM = sym;
    loadFormula(sym);
  }
  loadSeries(sym);   // 没指定品种时传空串，让后端挑最近写入的那份
}

/* 手绘折线：不引 Chart.js/CDN —— exe 是离线的，外链一挂就白屏。
   最优分数是台阶曲线（只往上抬），验证分数是每步均值（上下抖）。 */
function drawCurve(){
  const box = $('#curveBox'), cv = $('#curve'), empty = $('#curveEmpty');
  if(!box || !cv) return;
  const W = box.clientWidth, H = box.clientHeight;
  if(!W || !H) return;
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  const g = cv.getContext('2d');
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, W, H);

  const d = CURVE_DATA;
  const best = (d && d.ok && d.best) || [];
  if(!best.length){
    empty.style.display = 'flex';
    empty.textContent = (d && d.error) ? d.error : '还没有训练记录（第一步约需 15～30 秒）';
    return;
  }
  empty.style.display = 'none';

  const vals = best.concat((d.val || []).filter(v => v != null));
  let lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals);
  if(!isFinite(lo) || !isFinite(hi)) return;
  if(hi - lo < 1e-9){ hi += 0.1; lo -= 0.1; }
  const pad = (hi - lo) * 0.12; lo -= pad; hi += pad;

  const L = 46, R = 10, T = 12, B = 18, w = W - L - R, h = H - T - B;
  const n = best.length;
  const X = i => L + (n <= 1 ? w / 2 : i / (n - 1) * w);
  const Y = v => T + (1 - (v - lo) / (hi - lo)) * h;

  g.font = '10px "JetBrains Mono",Consolas,monospace';
  g.textAlign = 'right'; g.textBaseline = 'middle';
  for(let k = 0; k <= 3; k++){
    const v = lo + (hi - lo) * k / 3, y = Y(v);
    g.strokeStyle = 'rgba(120,190,235,0.07)';
    g.beginPath(); g.moveTo(L, y); g.lineTo(W - R, y); g.stroke();
    g.fillStyle = '#6b7684'; g.fillText(v.toFixed(2), L - 6, y);
  }

  const line = (arr, color, fill) => {
    const pts = [];
    for(let i = 0; i < arr.length; i++){
      const v = arr[i];
      if(v == null) continue;
      pts.push([X(i), Y(v), i]);
    }
    if(!pts.length) return null;
    if(fill){
      g.beginPath(); g.moveTo(pts[0][0], T + h);
      pts.forEach(p => g.lineTo(p[0], p[1]));
      g.lineTo(pts[pts.length - 1][0], T + h); g.closePath();
      const grad = g.createLinearGradient(0, T, 0, T + h);
      grad.addColorStop(0, fill); grad.addColorStop(1, 'rgba(0,0,0,0)');
      g.fillStyle = grad; g.fill();
    }
    g.beginPath();
    let prev = null;
    pts.forEach(p => {
      if(prev !== null && p[2] === prev + 1) g.lineTo(p[0], p[1]);
      else g.moveTo(p[0], p[1]);
      prev = p[2];
    });
    g.strokeStyle = color; g.lineWidth = 1.6; g.lineJoin = 'round'; g.stroke();
    return pts;
  };
  line(d.val || [], '#58a6ff', 'rgba(88,166,255,0.16)');
  const bp = line(best, '#34f5c8', 'rgba(52,245,200,0.16)');
  if(bp && bp.length){
    const p = bp[bp.length - 1];
    g.beginPath(); g.arc(p[0], p[1], 3, 0, Math.PI * 2);
    g.fillStyle = '#34f5c8'; g.fill();
  }

  g.fillStyle = '#6b7684'; g.textBaseline = 'top';
  g.textAlign = 'left'; g.fillText('第 ' + (d.step_first ?? 0) + ' 步', L, T + h + 4);
  g.textAlign = 'right';
  g.fillText('第 ' + (d.step_last ?? 0) + ' 步', W - R, T + h + 4);
}

/* 鼠标移到曲线上看具体某一步的分数 */
function bindCurveHover(){
  const box = $('#curveBox'), cv = $('#curve'), tip = $('#curveTip');
  if(!cv) return;
  cv.addEventListener('mousemove', ev => {
    const d = CURVE_DATA;
    if(!d || !d.ok || !d.best || !d.best.length){ tip.style.opacity = 0; return; }
    const rect = cv.getBoundingClientRect();
    const L = 46, R = 10, w = rect.width - L - R;
    let i = Math.round((ev.clientX - rect.left - L) / (w || 1) * (d.best.length - 1));
    i = Math.max(0, Math.min(d.best.length - 1, i));
    const b = d.best[i], v = (d.val || [])[i], st = (d.step || [])[i];
    tip.innerHTML = `第 ${st ?? '?'} 步<br>最优 <b style="color:#34f5c8">${fmt(b,4)}</b>`
      + (v != null ? `<br>验证 <b style="color:#58a6ff">${fmt(v,4)}</b>` : '');
    tip.style.opacity = 1;
    const tw = tip.offsetWidth;
    const x = L + (d.best.length <= 1 ? w / 2 : i / (d.best.length - 1) * w);
    tip.style.left = Math.max(4, Math.min(rect.width - tw - 4, x - tw / 2)) + 'px';
    tip.style.top = '6px';
  });
  cv.addEventListener('mouseleave', () => { tip.style.opacity = 0; });
}

/* 只画「当前任务」那块（曲线加载完要补一次最优分数，所以单独拆出来） */
function renderTrainNow(tj){
  tj = tj || {};
  $('#btnTrain').disabled = !!tj.running || STARTING;
  $('#btnTrainStop').disabled = !tj.running;

  if(tj.external){
    $('#trainBar').style.width = '0';
    const s = CURVE_DATA && CURVE_DATA.ok ? CURVE_DATA : null;
    const sameSym = !!(s && s.symbol && tj.symbol
      && s.symbol.toUpperCase() === String(tj.symbol).toUpperCase());
    $('#trainNow').innerHTML = `<div class="rows">
      <span class="k">品种</span><span class="v">${esc(tj.symbol||'–')}</span>
      <span class="k">进度</span><span class="v">第 ${tj.step??'?'} 步</span>
      <span class="k">最优分数</span><span class="v">${fmt(tj.best ?? (sameSym ? s.best_score : null),4)}</span>
      <span class="k">验证分数</span><span class="v">${sameSym ? fmt(s.val_score,4) : '–'}</span>
      <span class="k">状态</span><span class="v" style="color:var(--warn)">外部训练</span>
    </div>
    <div class="hint" style="margin-top:8px">${esc(tj.external_reason||'这个训练不是本控制台启动的')}，无法在此停止。要接管请先停掉原进程。</div>`
    + (s && s.symbol && !sameSym
        ? `<div class="hint" style="margin-top:4px">曲线显示的是 ${esc(s.symbol)}（你在左侧选的文件）。</div>`
        : '');
    return;
  }
  if(!tj.running){
    const s = CURVE_DATA && CURVE_DATA.ok ? CURVE_DATA : null;
    let html = '';
    if(tj.last_error){
      html += `<div class="errbox"><div class="t">上次未能开始训练</div>${esc(tj.last_error)}</div>`;
    }else if(tj.last_exit === 0 && tj.last_exit_age != null && tj.last_exit_age < 1800){
      html += `<div class="hint" style="margin-bottom:6px">上次训练已正常结束（退出码 0）</div>`;
    }
    const msg = s
      ? `没有正在运行的训练（下面是 ${esc(s.symbol)} 上一轮的曲线，共 ${s.points} 点）`
      : '没有正在运行的训练';
    $('#trainNow').innerHTML = html + `<span class="dimv">${msg}</span>`;
    $('#trainBar').style.width = '0';
    SPEED = {step:null, t:0, value:null};
    return;
  }

  const step = tj.step, steps = tj.steps;
  const base = (tj.start_step == null) ? 0 : tj.start_step;
  const span = (steps && steps > base) ? steps - base : 0;
  const done = (step == null) ? 0 : Math.max(0, step - base);
  const p = span ? Math.min(100, done/span*100) : 0;
  $('#trainBar').style.width = p+'%';

  // 速度：只在步数真的前进时更新采样点，否则每 3 秒一次的空刷新会把
  // 时间基准一直往后推，算出来的速度永远是 0
  const now = Date.now() / 1000;
  if(step != null && (SPEED.step === null || step > SPEED.step)){
    if(SPEED.step !== null && SPEED.t) SPEED.value = (step - SPEED.step) / ((now - SPEED.t) / 60);
    SPEED.step = step; SPEED.t = now;
  }else if(step != null && SPEED.step !== null && step < SPEED.step){
    SPEED = {step, t: now, value: null};
  }
  const spd = (SPEED.value && SPEED.value > 0) ? SPEED.value : null;
  const left = (span && step != null) ? Math.max(0, steps - step) : null;
  const eta = (spd && left != null) ? left / spd * 60 : null;
  const s = CURVE_DATA && CURVE_DATA.ok ? CURVE_DATA : null;

  const range = (span) ? `本次已练 ${done} / ${span} 步（起点第 ${base} 步）` : '';
  $('#trainNow').innerHTML = `
    <div class="rows">
      <span class="k">品种</span><span class="v">${esc(tj.symbol||'–')}</span>
      <span class="k">进度</span><span class="v">${step!=null?step:(tj.phase==='starting'?'启动中':'?')} / ${steps??'?'}　${p?p.toFixed(0)+'%':''}</span>
      <span class="k">最优分数</span><span class="v">${fmt(tj.best ?? (s && s.best_score),4)}</span>
      <span class="k">验证分数</span><span class="v">${fmt(s && s.val_score,4)}</span>
      <span class="k">速度</span><span class="v">${spd ? spd.toFixed(2)+' 步/分' : '–'}</span>
      <span class="k">剩余</span><span class="v">${eta!=null ? '约 '+dur(eta) : '–'}</span>
      <span class="k">已运行</span><span class="v">${dur(tj.uptime_sec||0)}</span>
      <span class="k">PID</span><span class="v">${tj.pid||'–'}</span>
    </div>
    ${range?`<div class="hint" style="margin-top:8px">${esc(range)}</div>`:''}`;
}

function renderTrain(){
  const tj = STATE.train_job || {};
  const sel = $('#dataFile');
  if(sel.dataset.n !== String((STATE.data_files||[]).length)){
    const keep = sel.value;
    sel.innerHTML = (STATE.data_files||[]).map(f=>
      `<option value="${esc(f.path)}" ${f.empty?'disabled':''}>`+
      `${esc(f.symbol)} ${esc(f.timeframe)} — ${esc(f.name)} (${esc(f.size_text||'')}${f.empty?'，空文件':''})</option>`
    ).join('') || '<option value="">未找到 parquet 数据</option>';
    if(keep) sel.value = keep;
    sel.dataset.n = (STATE.data_files||[]).length;
    loadPlan();
  }
  // 只在训练进行中把下拉框对齐到当前任务，否则每 3 秒一次的刷新
  // 会把用户刚选好的品种强行改回去，看起来像「选不动」
  if(tj.running && tj.data_file && [...sel.options].some(o=>o.value===tj.data_file)) sel.value = tj.data_file;

  renderTrainNow(tj);
  syncTrainViz(tj);
}

async function startTrain(){
  if(STARTING) return;
  const btn = $('#btnTrain');
  const data_file = $('#dataFile').value;
  if(!data_file) return toast('请选择数据文件', true);
  const info = await ensureDataInfo(data_file);
  if(info && info.ok === false && info.blocking)
    return toast('这份数据不能训练：' + info.error, true);
  const add = selectedAddSteps();
  const costRaw = $('#cost').value;
  const cost = costRaw === '' ? null : Number(costRaw);
  if(cost !== null && (!Number.isFinite(cost) || cost < 0)) return toast('成本率不合法', true);
  const from_scratch = $('#fromScratch').checked;
  const tj = STATE.train_job || {};
  if(from_scratch && !confirm('从零开始会删除该品种已有的全部检查点，继续？')) return;
  if(tj.external && !confirm('检测到疑似外部训练：' + (tj.external_reason || '训练历史刚被更新')
      + '\n同时启动可能互相覆盖检查点，仍要启动吗？')) return;

  STARTING = true;
  const label = btn.textContent;
  btn.disabled = true;
  btn.textContent = '启动中…';
  toast('正在启动训练…');
  try{
    const r = await api('/api/train/start', {data_file, steps:add, cost, from_scratch});
    if(!r.ok) throw new Error(r.error || '启动失败');
    const range = (r.start_step != null) ? `（第 ${r.start_step} → ${r.total_steps} 步）` : '';
    toast('训练已启动 pid=' + r.pid + range);
  }catch(e){
    toast('启动失败：' + e.message, true);
  }finally{
    STARTING = false;
    btn.textContent = label;
    btn.disabled = false;
    await refresh();
    loadPlan();
  }
  if(TAB === 'train') setTimeout(loadTrainLog, 800);
}
async function stopTrain(){
  try{ await api('/api/train/stop',{}); toast('训练已停止'); }catch(e){ toast('停止失败：'+e.message, true); }
  refresh();
}

function renderLive(){
  const box = $('#liveList');
  const live = (STATE.services||[]).filter(s=>s.kind==='live');
  if(!live.length){ box.innerHTML = '<div class="empty">配置里没有启用实盘品种</div>'; return; }
  box.innerHTML = live.map(s=>{
    const cls = s.running ? 'st run' : 'st stop';
    return `<div class="svc" style="margin-bottom:10px">
      <div class="hd"><span class="nm">${esc(s.title)}</span><span class="${cls}">${s.running?'运行中':'已停止'}</span></div>
      <div class="ds">${esc(s.desc)}${s.pid?' · pid '+s.pid:''}</div>
      <div class="ft">
        <label class="chk"><input type="checkbox" id="dry-${s.key}" ${s.running?'disabled':''}> dry-run（只算不下单）</label>
        <span style="flex:1"></span>
        ${s.running
          ? `<button class="btn sm" onclick="svcStop('${s.key}')">停止</button>`
          : `<button class="btn sm primary" onclick="startLive('${s.key}')">启动</button>`}
      </div>
    </div>`;
  }).join('');
}
function startLive(key){
  const el = document.getElementById('dry-'+key);
  svcStart(key, el && el.checked);
}

/* ── 日志页 ── */
function renderLogKeys(){
  const sel = $('#logKey');
  const opts = [['train','训练'], ...(STATE.services||[]).map(s=>[s.key, s.title])];
  const cur = sel.value;
  sel.innerHTML = opts.map(([k,t])=>`<option value="${k}">${esc(t)}</option>`).join('');
  if(cur) sel.value = cur;
  sel.onchange = ()=>loadLog(true);
}
async function loadLog(reset){
  try{
    const key = $('#logKey').value || 'train';
    const r = await api(`/api/log?key=${encodeURIComponent(key)}&n=600`);
    const box = $('#logBox');
    box.textContent = (r.lines||[]).join('\n') || '（暂无输出）';
    $('#logMeta').textContent = `${(r.lines||[]).length} 行 · ${STATE?STATE.now:''}`;
    if($('#autoScroll').checked) box.scrollTop = box.scrollHeight;
  }catch(e){}
}

/* ── 轮询 ── */
$('#dataFile').addEventListener('change', ()=>{ SEL_MANUAL = true; loadPlan(); syncTrainViz(STATE?STATE.train_job:{}); });
$('#fromScratch').addEventListener('change', loadPlan);
let planTimer = null;
$('#steps').addEventListener('input', ()=>{ clearTimeout(planTimer); planTimer = setTimeout(loadPlan, 300); });

bindCurveHover();
window.addEventListener('resize', ()=>{ if(TAB==='train') drawCurve(); });
refresh().then(()=>{ renderLogKeys(); loadPlan(); });
setInterval(()=>{ if(!document.hidden) refresh(); }, 3000);
setInterval(()=>{ if(TAB==='train') loadTrainLog(); }, 2500);
setInterval(()=>{ if(TAB==='live') loadLiveLog(); }, 2500);
setInterval(()=>{ if(TAB==='log') loadLog(); }, 2500);
</script>
</body>
